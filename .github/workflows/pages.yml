# Publish the HELMUS page (web/) to GitHub Pages.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy HELMUS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push does not cancel one already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the page loads the network from web/model/: always publish the weights, phrasebook, persona and vocabulary
      # that are in the repo, and the results of the last evaluation
      - name: Copy the current network into the site
        run: |
          mkdir -p web/model
          cp weights/helmus.edits weights/phrasebook.json weights/persona.json weights/vocab.txt web/model/
          cp eval/results.json web/model/results.json
          cp baselines/eliza/doctor.txt web/doctor.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
